name: warm_alarm
description: A platform-honest Flutter alarm plugin for Android, iOS, and macOS.
version: 0.1.0+1

homepage: https://github.com/AndrewDongminYoo/warm_alarm
repository: https://github.com/AndrewDongminYoo/warm_alarm
issue_tracker: https://github.com/AndrewDongminYoo/warm_alarm/issues

resolution: workspace

environment:
  sdk: ">=3.10.0 <4.0.0"
  flutter: ">=3.18.0-18.0.pre.54"

flutter:
  plugin:
    platforms:
      android:
        default_package: warm_alarm_android
      ios:
        default_package: warm_alarm_ios
      macos:
        default_package: warm_alarm_macos

dependencies:
  flutter:
    sdk: flutter
  warm_alarm_android: ^0.1.0+1
  warm_alarm_ios: ^0.1.0+1
  warm_alarm_macos: ^0.1.0+1
  warm_alarm_platform_interface: ^0.1.0+1

dev_dependencies:
  flutter_test:
    sdk: flutter
  mocktail: ^1.0.5
  plugin_platform_interface: ^2.1.8
  very_good_analysis: ^10.2.0
