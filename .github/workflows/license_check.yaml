name: license_check

permissions: read-all

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  pull_request:
    branches:
      - main
    paths:
      - warm_alarm/pubspec.yaml
      - warm_alarm_platform_interface/pubspec.yaml
      - .github/workflows/license_check.yaml
  push:
    branches:
      - main
    paths:
      - warm_alarm/pubspec.yaml
      - warm_alarm_platform_interface/pubspec.yaml
      - .github/workflows/license_check.yaml

jobs:
  license_check:
    uses: VeryGoodOpenSource/very_good_workflows/.github/workflows/license_check.yml@v1
    with:
      allowed: MIT,BSD-3-Clause,BSD-2-Clause,Apache-2.0,Zlib
      working_directory: .
      flutter_version: 3.41.9
      flutter_channel: stable
      dart_sdk: 3.11.5
