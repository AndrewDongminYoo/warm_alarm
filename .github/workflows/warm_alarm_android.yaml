name: warm_alarm_android

permissions: read-all

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  pull_request:
    paths:
      - .github/workflows/pana.yaml
      - .github/workflows/warm_alarm_android.yaml
      - warm_alarm_android/**
  push:
    branches:
      - main
    paths:
      - .github/workflows/pana.yaml
      - .github/workflows/warm_alarm_android.yaml
      - warm_alarm_android/**

jobs:
  build:
    uses: VeryGoodOpenSource/very_good_workflows/.github/workflows/flutter_package.yml@61d25935870f12a1f2c23f2a04d5f193c83f4e5d # v1.21.1
    with:
      coverage_excludes: "**/*.g.dart"
      format_line_length: 120
      working_directory: warm_alarm_android

  native-unit-test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          cache: true

      - name: Install workspace dependencies
        working-directory: warm_alarm/example
        run: flutter pub get

      - name: Generate Android Gradle wrapper
        working-directory: warm_alarm/example
        run: flutter create --platforms=android .

      - name: Run Android native unit tests
        working-directory: warm_alarm/example/android
        run: ./gradlew :warm_alarm_android:testDebugUnitTest --console=plain

  instrumented-test:
    # Intent.filterEquals decides whether the regular alarm and its wake-check retrigger
    # are one handle or two, and no JVM test can reach it. This job is the only gate that
    # can. Linux runners are 1x-billed and the only place the emulator gets hardware
    # acceleration; macos-latest is arm64, where the default x86 image never boots.
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          cache: true

      - name: Install workspace dependencies
        working-directory: warm_alarm/example
        run: flutter pub get

      - name: Generate Android Gradle wrapper
        working-directory: warm_alarm/example
        run: flutter create --platforms=android .

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run Android instrumented tests
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 29
          arch: x86_64
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          working-directory: warm_alarm/example/android
          script: ./gradlew :warm_alarm_android:connectedDebugAndroidTest --console=plain

  pana:
    uses: ./.github/workflows/pana.yaml
    with:
      working_directory: warm_alarm_android
