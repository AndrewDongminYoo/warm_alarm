name: warm_alarm_android

permissions: read-all

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  pull_request:
    paths:
      - .github/workflows/pana.yaml
      - .github/workflows/warm_alarm_android.yaml
      - warm_alarm_android/**
  push:
    branches:
      - main
    paths:
      - .github/workflows/pana.yaml
      - .github/workflows/warm_alarm_android.yaml
      - warm_alarm_android/**

jobs:
  build:
    uses: VeryGoodOpenSource/very_good_workflows/.github/workflows/flutter_package.yml@v1
    with:
      flutter_version: 3.41.9
      coverage_excludes: "**/*.g.dart"
      format_line_length: 120
      working_directory: warm_alarm_android

  native-unit-test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2.23.0
        with:
          flutter-version: 3.41.9
          channel: stable
          cache: true

      - name: Install workspace dependencies
        working-directory: warm_alarm/example
        run: flutter pub get

      - name: Run Android native unit tests
        working-directory: warm_alarm/example/android
        run: ./gradlew :warm_alarm_android:testDebugUnitTest --console=plain

  pana:
    uses: ./.github/workflows/pana.yaml
    with:
      working_directory: warm_alarm_android
