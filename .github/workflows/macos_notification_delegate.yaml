name: macos_notification_delegate

permissions: read-all

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  pull_request:
    paths:
      - .github/workflows/macos_notification_delegate.yaml
      - warm_alarm_macos/**
      - tool/run_macos_native_tests.sh
      - tool/macos_test_host.swift
  push:
    branches:
      - main
    paths:
      - .github/workflows/macos_notification_delegate.yaml
      - warm_alarm_macos/**
      - tool/run_macos_native_tests.sh
      - tool/macos_test_host.swift

jobs:
  notification-delegate-tests:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          flutter-version: 3.47.7
          cache: true

      - name: Prepare the macOS Flutter framework
        run: flutter precache --macos

      - name: Run native callbacks in an app-bundle XCTest host
        run: bash tool/run_macos_native_tests.sh
