name: warm_alarm_platform_interface

permissions: read-all

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  pull_request:
    paths:
      - .github/workflows/pana.yaml
      - .github/workflows/warm_alarm_platform_interface.yaml
      - warm_alarm_platform_interface/**
  push:
    branches:
      - main
    paths:
      - .github/workflows/pana.yaml
      - .github/workflows/warm_alarm_platform_interface.yaml
      - warm_alarm_platform_interface/**

jobs:
  build:
    uses: VeryGoodOpenSource/very_good_workflows/.github/workflows/flutter_package.yml@bf86fc749b907c6cc60e655f7f2ef619287b1b15 # v2.0.3
    with:
      flutter_version: 3.47.8
      coverage_excludes: "**/*.g.dart"
      format_line_length: 120
      working_directory: warm_alarm_platform_interface

  pana:
    uses: ./.github/workflows/pana.yaml
    with:
      working_directory: warm_alarm_platform_interface
