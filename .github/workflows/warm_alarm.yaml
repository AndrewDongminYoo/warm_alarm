name: warm_alarm

permissions: read-all

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  workflow_dispatch:
  pull_request:
    paths:
      - .github/workflows/warm_alarm.yaml
      - warm_alarm/**
  push:
    branches:
      - main
    tags:
      - v*
    paths:
      - .github/workflows/warm_alarm.yaml
      - warm_alarm/**

jobs:
  spell-check:
    uses: VeryGoodOpenSource/very_good_workflows/.github/workflows/spell_check.yml@v1
    with:
      config: cspell.config.yaml
      includes: |
        **/*.md
        !brick/**/*.md
        .*/**/*.md
      modified_files_only: false

  build:
    uses: VeryGoodOpenSource/very_good_workflows/.github/workflows/flutter_package.yml@v1
    with:
      flutter_version: 3.41.9
      coverage_excludes: "**/*.g.dart"
      format_line_length: 120
      working_directory: warm_alarm

  pana:
    uses: VeryGoodOpenSource/very_good_workflows/.github/workflows/pana.yml@v1
    with:
      working_directory: warm_alarm

  android:
    # The three E2E jobs are red on every runner. Until they are green they run
    # on demand or on a release tag only, instead of billing every push and PR.
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')

    # Linux runners are 1x-billed and the only place this action gets hardware
    # acceleration: macos-latest is arm64, where the default x86 image never boots.
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: warm_alarm/example

    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          # Gradle 9.0 requires a JVM between 17 and 24 to execute.
          java-version: "17"

      - uses: subosito/flutter-action@v2

      - name: Install Fluttium
        run: flutter pub global activate fluttium_cli

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: AVD Cache
        uses: actions/cache@v6
        id: avd-cache
        with:
          path: |
            ~/.android/avd/*
            ~/.android/adb*
          key: avd-29-${{ runner.os }}

      - name: Cache AVD Snapshot
        if: steps.avd-cache.outputs.cache-hit != 'true'
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 29
          force-avd-creation: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: false
          script: echo "Generated AVD snapshot for caching."

      - name: E2E Tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 29
          script: fluttium test flows/test_readiness.yaml -d android
          working-directory: warm_alarm/example

  ios:
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
    runs-on: macos-latest

    defaults:
      run:
        working-directory: warm_alarm/example

    steps:
      - uses: actions/checkout@v7

      - uses: subosito/flutter-action@v2

      - name: Install Fluttium
        run: flutter pub global activate fluttium_cli

      - name: Start Simulator
        # Start an iPhone simulator
        run: |
          UDID=$(xcrun xctrace list devices | grep "^iPhone" | awk '{gsub(/[()]/,""); print $NF}' | head -n 1)
          echo $UDID
          xcrun simctl boot "${UDID:?No Simulator with this name found}"

      - name: E2E Tests
        run: fluttium test flows/test_readiness.yaml -d iPhone

  macos:
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
    runs-on: macos-15

    defaults:
      run:
        working-directory: warm_alarm/example

    steps:
      - uses: actions/checkout@v7

      - uses: subosito/flutter-action@v2

      - name: Install Fluttium
        run: flutter pub global activate fluttium_cli

      - name: E2E Tests
        run: fluttium test flows/test_readiness.yaml -d macos
