name: warm_alarm_macos

permissions: read-all

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  pull_request:
    paths:
      - .github/workflows/pana.yaml
      - .github/workflows/warm_alarm_macos.yaml
      - warm_alarm_macos/**
  push:
    branches:
      - main
    paths:
      - .github/workflows/pana.yaml
      - .github/workflows/warm_alarm_macos.yaml
      - warm_alarm_macos/**

jobs:
  build:
    uses: VeryGoodOpenSource/very_good_workflows/.github/workflows/flutter_package.yml@61d25935870f12a1f2c23f2a04d5f193c83f4e5d # v1.21.1
    with:
      coverage_excludes: "**/*.g.dart"
      format_line_length: 120
      working_directory: warm_alarm_macos

  native-host-build:
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          cache: true

      - name: Install workspace dependencies
        working-directory: warm_alarm/example
        run: flutter pub get

      - name: Build the macOS example host
        working-directory: warm_alarm/example
        run: flutter build macos --debug

  pana:
    uses: ./.github/workflows/pana.yaml
    with:
      working_directory: warm_alarm_macos
