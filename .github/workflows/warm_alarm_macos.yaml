name: warm_alarm_macos

permissions: read-all

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  pull_request:
    paths:
      - .github/workflows/pana.yaml
      - .github/workflows/warm_alarm_macos.yaml
      - warm_alarm_macos/**
  push:
    branches:
      - main
    paths:
      - .github/workflows/pana.yaml
      - .github/workflows/warm_alarm_macos.yaml
      - warm_alarm_macos/**

jobs:
  build:
    uses: VeryGoodOpenSource/very_good_workflows/.github/workflows/flutter_package.yml@v1
    with:
      coverage_excludes: "**/*.g.dart"
      format_line_length: 120
      working_directory: warm_alarm_macos

  native-host-build:
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v7

      - uses: subosito/flutter-action@v2.23.0
        with:
          channel: stable
          cache: true

      - name: Install workspace dependencies
        working-directory: warm_alarm/example
        run: flutter pub get

      - name: Build the macOS example host
        working-directory: warm_alarm/example
        run: flutter build macos --debug

  pana:
    uses: ./.github/workflows/pana.yaml
    with:
      working_directory: warm_alarm_macos
