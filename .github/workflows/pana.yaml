name: Pana

permissions: read-all

on:
  workflow_call:
    inputs:
      min_score:
        required: false
        type: number
        default: 120
      working_directory:
        required: true
        type: string

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: 📚 Git Checkout
        uses: actions/checkout@v7

      - name: 🐦 Setup Flutter
        uses: subosito/flutter-action@v2.23.0
        with:
          channel: stable
          cache: true

      - name: 📦 Install Pana
        run: flutter pub global activate pana

      - name: 📊 Verify Pana Score
        env:
          MIN_SCORE: ${{ inputs.min_score }}
          PACKAGE_DIRECTORY: ${{ inputs.working_directory }}
        run: |
          PANA=$(pana "$PACKAGE_DIRECTORY" --project-root . --no-warning)
          PANA_SCORE=$(echo "$PANA" | sed -n "s/.*Points: \([0-9]*\)\/\([0-9]*\)./\1\/\2/p")
          echo "Score: $PANA_SCORE"
          IFS='/' read -r SCORE _ <<< "$PANA_SCORE"
          if [[ ! "$SCORE" =~ ^[0-9]+$ ]]; then echo "Unable to read the Pana score!"; exit 1; fi
          if (( SCORE < MIN_SCORE )); then echo "The minimum score of $MIN_SCORE was not met!"; exit 1; fi
