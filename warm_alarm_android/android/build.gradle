plugins {
    id "com.android.library"
    id "org.jetbrains.kotlin.android"
}

group 'com.andrew.alarm'
version '1.0-SNAPSHOT'

allprojects {
    repositories {
        google()
        mavenCentral()
        gradlePluginPortal()
    }
}

android {
    if (project.android.hasProperty("namespace")) {
        namespace 'com.andrew.alarm'
    }

    compileSdk 34

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }

    sourceSets {
        main.kotlin.srcDirs += 'src/main/kotlin'
        test.kotlin.srcDirs += 'src/test/kotlin'
        androidTest.kotlin.srcDirs += 'src/androidTest/kotlin'
    }

    defaultConfig {
        // 19 was the plugin template's value and was never reachable: this module compiles
        // against the Flutter embedding, and Flutter's own floor is 24 (FlutterExtension.kt).
        // 21 is what androidx.test needs to build the instrumented test APK, and it stays
        // below that floor, so no consumer loses support.
        minSdkVersion 21
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
    }

    dependencies {
        testImplementation 'org.json:json:20260522'
        testImplementation 'org.jetbrains.kotlin:kotlin-test'
        testImplementation 'org.mockito:mockito-core:5.0.0'
        // The instrumented test needs a real PendingIntent registry, nothing more:
        // plain JUnit4 under AndroidJUnitRunner, without androidx.test.ext.
        androidTestImplementation 'androidx.test:runner:1.6.2'
        androidTestImplementation 'junit:junit:4.13.2'
    }

    testOptions {
        unitTests.all {
            useJUnitPlatform()

            testLogging {
               events "passed", "skipped", "failed", "standardOut", "standardError"
               outputs.upToDateWhen {false}
               showStandardStreams = true
            }
        }
    }
}

kotlin {
    compilerOptions {
        jvmTarget = org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_17
    }
}
