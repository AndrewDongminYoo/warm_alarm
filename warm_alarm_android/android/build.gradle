plugins {
    id "com.android.library"
    id "org.jetbrains.kotlin.android"
}

group 'com.andrew.alarm'
version '1.0-SNAPSHOT'

allprojects {
    repositories {
        google()
        mavenCentral()
        gradlePluginPortal()
    }
}

android {
    if (project.android.hasProperty("namespace")) {
        namespace 'com.andrew.alarm'
    }

    compileSdk 34

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }

    sourceSets {
        main.kotlin.srcDirs += 'src/main/kotlin'
        test.kotlin.srcDirs += 'src/test/kotlin'
        androidTest.kotlin.srcDirs += 'src/androidTest/kotlin'
    }

    defaultConfig {
        minSdkVersion 19
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
    }

    dependencies {
        testImplementation 'org.json:json:20260522'
        testImplementation 'org.jetbrains.kotlin:kotlin-test'
        testImplementation 'org.mockito:mockito-core:5.24.0'
        // The instrumented test needs a real PendingIntent registry, nothing more:
        // plain JUnit4 under AndroidJUnitRunner, without androidx.test.ext.
        androidTestImplementation 'androidx.test:runner:1.6.2'
        androidTestImplementation 'junit:junit:4.13.2'
    }

    testOptions {
        // Preserve the legacy test APK contract across AGP default changes.
        targetSdk = 19

        unitTests.all {
            useJUnitPlatform()
            // SDK fixtures replace Android's static final SDK_INT between cases.
            // Interpret test code so the JIT cannot retain an earlier SDK value.
            jvmArgs '-Xint'

            testLogging {
               events "passed", "skipped", "failed", "standardOut", "standardError"
               outputs.upToDateWhen {false}
               showStandardStreams = true
            }
        }
    }
}

kotlin {
    compilerOptions {
        jvmTarget = org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_17
    }
}

// Native instrumentation does not start a Flutter engine or decode Flutter images.
// Exclude its API 21 image dependency only from the test APK, without overriding minSdk.
configurations.matching { it.name.endsWith('AndroidTestRuntimeClasspath') }.configureEach {
    exclude group: 'androidx.exifinterface', module: 'exifinterface'
}
