name: warm_alarm_android
description: Android implementation of the warm_alarm plugin
version: 0.1.0+1

publish_to: none
resolution: workspace

environment:
  sdk: ">=3.10.0 <4.0.0"

flutter:
  plugin:
    implements: warm_alarm
    platforms:
      android:
        package: com.andrew.alarm
        pluginClass: WarmAlarmPlugin
        dartPluginClass: WarmAlarmAndroid

dependencies:
  flutter:
    sdk: flutter
  warm_alarm_platform_interface:
    path: ../warm_alarm_platform_interface

dev_dependencies:
  flutter_test:
    sdk: flutter
  mocktail: ^1.0.5
  pigeon: ^26.3.4
  plugin_platform_interface: ^2.1.8
  very_good_analysis: ^10.2.0
